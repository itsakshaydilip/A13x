<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#2d2d2d"/>
  
  <!-- Clock background circle -->
  <circle cx="256" cy="220" r="120" fill="#3a3a3a" stroke="#5a5a5a" stroke-width="4"/>
  
  <!-- Clock markings -->
  <g id="clock-marks" stroke="#888888" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="110" x2="256" y2="125"/>
    <line x1="346" y1="220" x2="331" y2="220"/>
    <line x1="256" y1="330" x2="256" y2="315"/>
    <line x1="166" y1="220" x2="181" y2="220"/>
  </g>
  
  <!-- Clock hands -->
  <line x1="256" y1="220" x2="256" y2="160" stroke="#4a90e2" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="220" x2="300" y2="220" stroke="#4a90e2" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="220" r="8" fill="#4a90e2"/>
  
  <!-- Save/backup icon -->
  <g transform="translate(350, 180)">
    <rect x="0" y="0" width="60" height="60" rx="4" fill="#28a745" stroke="#ffffff" stroke-width="2"/>
    <rect x="10" y="5" width="40" height="10" fill="#ffffff"/>
    <path d="M 15 25 L 25 35 L 45 15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Version indicators -->
  <g transform="translate(130, 350)">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#555555" stroke="#777777" stroke-width="2"/>
    <text x="25" y="20" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle">V001</text>
  </g>
  <g transform="translate(195, 350)">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#555555" stroke="#777777" stroke-width="2"/>
    <text x="25" y="20" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle">V002</text>
  </g>
  <g transform="translate(260, 350)">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#28a745" stroke="#ffffff" stroke-width="2"/>
    <text x="25" y="20" font-family="monospace" font-size="14" fill="#ffffff" text-anchor="middle">V003</text>
  </g>
  <g transform="translate(325, 350)">
    <rect x="0" y="0" width="50" height="30" rx="3" fill="#555555" stroke="#777777" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
    <text x="25" y="20" font-family="monospace" font-size="14" fill="#888888" text-anchor="middle">V004</text>
  </g>
  
  <!-- Title -->
  <text x="256" y="445" font-family="Arial" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Revention</text>
  <text x="256" y="475" font-family="Arial" font-size="18" fill="#aaaaaa" text-anchor="middle">Autosave Utility</text>
</svg>