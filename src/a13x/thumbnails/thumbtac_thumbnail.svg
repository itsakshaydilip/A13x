<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#2d2d2d"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#404040" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" fill="url(#grid)"/>
  
  <!-- 3D cube in center -->
  <path d="M 256 180 L 340 220 L 340 300 L 256 340 L 172 300 L 172 220 Z" 
        fill="#5a5a5a" stroke="#888888" stroke-width="2"/>
  
  <!-- 3x3 grid of locator points -->
  <g id="locators">
    <!-- Top row -->
    <circle cx="170" cy="120" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="256" cy="120" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="342" cy="120" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Middle row -->
    <circle cx="170" cy="260" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="256" cy="260" r="14" fill="#ffdd00" stroke="#ffffff" stroke-width="3"/><!-- Center highlighted -->
    <circle cx="342" cy="260" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Bottom row -->
    <circle cx="170" cy="400" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="256" cy="400" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
    <circle cx="342" cy="400" r="12" fill="#ff6b6b" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Pivot indicator (thumbtack icon) -->
  <g transform="translate(256, 260)">
    <circle cx="0" cy="0" r="25" fill="#ffdd00" opacity="0.3"/>
    <path d="M -8 -15 L 8 -15 L 8 0 L 3 0 L 3 20 L -3 20 L -3 0 L -8 0 Z" 
          fill="#ffffff" stroke="#333333" stroke-width="1"/>
    <circle cx="0" cy="-15" r="6" fill="#333333"/>
  </g>
  
  <!-- Title -->
  <text x="256" y="475" font-family="Arial" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">ThumbTac</text>
  <text x="256" y="500" font-family="Arial" font-size="18" fill="#aaaaaa" text-anchor="middle">Pivot Grid Tool</text>
</svg>