<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#2d2d2d"/>
  
  <!-- 3D sphere with PBR texturing -->
  <defs>
    <radialGradient id="metallic" cx="40%" cy="35%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="40%" style="stop-color:#a8a8a8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3a3a3a;stop-opacity:1"/>
    </radialGradient>
    
    <filter id="normalMap">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- Main sphere -->
  <circle cx="256" cy="256" r="140" fill="url(#metallic)" filter="url(#normalMap)"/>
  
  <!-- Texture layer indicators -->
  <g id="texture-slots" transform="translate(50, 120)">
    <!-- Base Color -->
    <rect x="0" y="0" width="100" height="60" rx="4" fill="#e74c3c" stroke="#ffffff" stroke-width="2"/>
    <text x="50" y="25" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Base</text>
    <text x="50" y="45" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Color</text>
    
    <!-- Roughness -->
    <rect x="0" y="75" width="100" height="60" rx="4" fill="#555555" stroke="#ffffff" stroke-width="2"/>
    <text x="50" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Rough</text>
    <text x="50" y="120" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">ness</text>
    
    <!-- Metallic -->
    <rect x="0" y="150" width="100" height="60" rx="4" fill="#888888" stroke="#ffffff" stroke-width="2"/>
    <text x="50" y="175" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Metal</text>
    <text x="50" y="195" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">lic</text>
    
    <!-- Normal -->
    <rect x="0" y="225" width="100" height="60" rx="4" fill="#6b8ce2" stroke="#ffffff" stroke-width="2"/>
    <text x="50" y="250" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Normal</text>
    <text x="50" y="270" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle">Map</text>
  </g>
  
  <!-- Arrow pointing to sphere -->
  <g id="loader-arrow">
    <path d="M 150 256 L 90 256" stroke="#ffdd00" stroke-width="6" stroke-linecap="round" fill="none"/>
    <polygon points="95,256 110,246 110,266" fill="#ffdd00"/>
  </g>
  
  <!-- Arnold logo hint (A) -->
  <g transform="translate(380, 380)">
    <circle cx="0" cy="0" r="50" fill="#ff6b35" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="20" font-family="Arial" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
  </g>
  
  <!-- Title -->
  <text x="256" y="490" font-family="Arial" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Substance Loader</text>
</svg>